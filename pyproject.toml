[project]
name = "inmobiliaria-platform"
version = "0.1.0"
description = "Inmobiliaria platform with FastAPI, SQLAlchemy 2.0 async, PostgreSQL 16, PostGIS, Redis 7"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis[hiredis]>=5.2.0",
    "structlog>=25.0.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.7.0",
    "passlib[bcrypt]>=1.7.4",
    "PyJWT>=2.10.0",
    "python-multipart>=0.0.20",
    "PyYAML>=6.0.2",
    "aiosmtplib>=3.0.0",
    "httpx>=0.28.0",
    "GeoAlchemy2>=0.15.0",
    "boto3>=1.37.0",
    "shapely>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "fakeredis>=2.26.0",
    "pytest-cov>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
