# ─────────────────────────────────────────────────────────────────────────────
# Inmobiliaria Platform — Nginx Server Configuration (HTTP-first)
#
# Serves the built React SPA and proxies /api to the API backend over plain
# HTTP. TLS/certbot is deferred until a domain points at this host; see the
# commented HTTPS server block at the bottom.
# ─────────────────────────────────────────────────────────────────────────────

# Upstream definitions
upstream api_backend {
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let's Encrypt ACME challenge (for future certbot webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri $uri/ =404;
    }

    # Security headers (HSTS/CSP are added once TLS is enabled)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── SPA root ───────────────────────────────────────────────────────────
    root /app/static;
    index index.html;

    location / {
        try_files $uri $uri/ @proxy_to_api;
    }

    # ── API proxy ──────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        limit_conn addr 20;

        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ── API v1 ────────────────────────────────────────────────────────────
    location /api/v1/ {
        limit_req zone=api burst=50 nodelay;
        limit_conn addr 20;

        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Documentation ──────────────────────────────────────────────────────
    location /docs {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /redoc {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openapi.json {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Auth endpoints (stricter rate limiting) ───────────────────────────
    location /api/v1/auth/ {
        limit_req zone=auth burst=10 nodelay;
        limit_conn addr 5;

        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ── Health checks (no rate limiting) ───────────────────────────────────
    location /health {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        access_log off;
        limit_req zone=general nodelay;
    }

    location /health/ready {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        access_log off;
        limit_req zone=general nodelay;
    }

    # ── Error pages ────────────────────────────────────────────────────────
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    # ── Proxy fallback ─────────────────────────────────────────────────────
    location @proxy_to_api {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

