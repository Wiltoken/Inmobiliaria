[databases]
; Production database via PgBouncer
inmobiliaria_db = host=postgres port=5432 dbname=inmobiliaria_db

[pgbouncer]
; Pool mode: transaction-level pooling for async workloads
pool_mode = transaction

; Connection limits
max_client_conn = 200
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3
max_db_connections = 100

; Timeouts (seconds)
server_idle_timeout = 600
server_connect_timeout = 15
server_login_retry = 3
query_wait_timeout = 30

; Performance
pkt_buf = 4096
listen_backlog = 100

; Logging
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1

; Health check
server_reset_query = DISCARD ALL
server_check_delay = 30
server_lifetime = 3600

; Auth
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
admin_users = inmuebles

; Application-level prepared statements aren't supported in transaction mode
; Disable them to prevent errors
server_round_robin = 1
