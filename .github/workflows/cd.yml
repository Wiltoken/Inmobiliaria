name: Build and Publish

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  # Lowercase, GHCR-compatible image prefix for this repository.
  API_IMAGE: ghcr.io/wiltoken/inmobiliaria-api
  NGINX_IMAGE: ghcr.io/wiltoken/inmobiliaria-nginx

jobs:
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}

      - name: Build and push nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: nginx/Dockerfile
          push: true
          tags: |
            ${{ env.NGINX_IMAGE }}:latest
            ${{ env.NGINX_IMAGE }}:${{ github.sha }}

  smoke:
    name: Smoke test (migrations + health)
    runs-on: ubuntu-latest
    needs: build-and-push

    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: inmobiliaria_db
          POSTGRES_USER: inmuebles
          POSTGRES_PASSWORD: changeme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inmuebles -d inmobiliaria_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t inmobiliaria-api .

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://inmuebles:changeme@localhost:5432/inmobiliaria_db
        run: |
          docker run --rm --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e SECRET_KEY="smoke-test-secret-key-not-for-production" \
            inmobiliaria-api alembic upgrade head

      - name: Smoke test /health/ready
        env:
          DATABASE_URL: postgresql+asyncpg://inmuebles:changeme@localhost:5432/inmobiliaria_db
          REDIS_URL: redis://localhost:6379/0
        run: |
          docker run -d --rm --network host --name api-smoke \
            -e DATABASE_URL="$DATABASE_URL" \
            -e REDIS_URL="$REDIS_URL" \
            -e SECRET_KEY="smoke-test-secret-key-not-for-production" \
            inmobiliaria-api
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health/ready; then
              echo "API healthy."
              docker stop api-smoke
              exit 0
            fi
            sleep 2
          done
          echo "API never became healthy." >&2
          docker logs api-smoke || true
          docker stop api-smoke || true
          exit 1
