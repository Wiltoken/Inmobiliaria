name: Backend CI

on:
  push:
    branches: ["**"]
    paths:
      - "app/**"
      - "tests/**"
      - "pyproject.toml"
      - "alembic.ini"
      - "migrations/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "tests/**"
      - "pyproject.toml"
      - "alembic.ini"
      - "migrations/**"
      - ".github/workflows/backend-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check app/

      - name: Run tests with coverage
        run: pytest tests/unit/ tests/integration/ -v --tb=short --cov=app --cov-report=term --cov-report=xml --ignore=tests/e2e

      - name: Upload coverage to Codecov (optional)
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: backend
        continue-on-error: true
